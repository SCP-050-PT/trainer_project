{% extends "base.html" %}
{% block title %}Классы{% endblock %}
{% block staff_content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0">Классы</h2><a href="{% url 'create_class' %}" class="btn btn-primary">Создать класс</a></div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>Класс</th><th>Учеников</th></tr>
                </thead>
                <tbody>
                    {% for c in classes %}
                    <tr>
                        <td><a href="{% url 'class_detail' c.id %}">{{ c.display_name }}</a></td>
                        <td>{{ c.student_count }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="2" class="text-center text-muted py-4">Классов нет</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
