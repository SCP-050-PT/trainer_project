{% extends "base.html" %}
{% block title %}Вход ученика{% endblock %}

{% block guest_content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-badge fs-1 text-success"></i>
                <h4 class="fw-bold mt-2 mb-1">Школьный портал</h4>
                <p class="text-muted small">Вход ученика</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Класс</label>
                    <select name="school_class" class="form-select" required>
                        <option value="" disabled selected>Выберите класс</option>
                        {% for c in classes %}
                        <option value="{{ c.id }}">{{ c.display_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label">PIN-код</label>
                    <input type="password" name="pin_code" class="form-control text-center"
                           maxlength="5" pattern="\d{5}" inputmode="numeric" placeholder="•••••" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Войти</button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="small text-muted">← На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
