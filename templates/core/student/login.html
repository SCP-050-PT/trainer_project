{% extends "base.html" %}
{% block title %}Вход ученика{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">

            <!-- Заголовок -->
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
                <h3 class="mt-2 fw-bold text-dark">Школьный Тренажёр</h3>
                <p class="text-muted small">ГБОУ Школа № 777</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 px-3 small">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="school_class" class="form-label fw-semibold">Выберите ваш класс</label>
                    <select name="school_class" id="school_class" class="form-select form-select-lg" required>
                        <option value="" disabled selected>-- Выберите класс --</option>
                        {% for c in classes %}
                        <option value="{{ c.id }}">{{ c.display_name }}</option>
                        {% empty %}
                        <option disabled>Классы ещё не добавлены админом</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label for="pin_code" class="form-label fw-semibold">Введите PIN-код (5 цифр)</label>
                    <input type="password" name="pin_code" id="pin_code"
                        class="form-control form-control-lg text-center fs-4 tracking-widest" placeholder="•••••"
                        maxlength="5" pattern="\d{5}" inputmode="numeric" autocomplete="off" required>
                    <div class="form-text text-center mt-2">
                        Код выдан вашим учителем.
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3 fw-bold fs-5">
                    Войти
                </button>
            </form>

            <hr class="my-4">
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-decoration-none small text-secondary">
                    Я учитель / администратор
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
