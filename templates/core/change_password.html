{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block header_title %}Профиль{% endblock %}
{% block staff_content %}
<div class="container-fluid py-4">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm" style="border-radius:16px;">
                <div class="card-body p-4">
                    <h5 class="mb-3">Личные данные</h5>
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="profile">
                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Фамилия</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                        </div>
                        {% if subjects %}
                        <div class="mb-3">
                            <label class="form-label">Предмет</label>
                            <select name="subject" class="form-select">
                                <option value="">—</option>
                                {% for s in subjects %}
                                <option value="{{ s.id }}" {% if user.subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}
                        <button type="submit" class="btn btn-purple">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm" style="border-radius:16px;">
                <div class="card-body p-4">
                    <h5 class="mb-3">Смена пароля</h5>
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="password">
                        <div class="mb-3">
                            <label class="form-label">Текущий пароль</label>
                            <input type="password" name="old_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Новый пароль</label>
                            <input type="password" name="new_password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Повтор</label>
                            <input type="password" name="new_password2" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-purple">Изменить пароль</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
