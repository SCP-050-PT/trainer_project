{% extends "base.html" %}
{% block title %}Вход для сотрудника{% endblock %}

{% block guest_content %}
<div class="card shadow-lg border-0 rounded-4 overflow-hidden">
    <div class="card-body p-5 text-center">
        <h2 class="fw-bold text-primary mb-4">Вход для сотрудников</h2>

        {% if form.errors %}
        <div class="alert alert-danger mb-4">Неверный логин или пароль.</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label for="id_username" class="form-label fw-semibold">Логин</label>
                {{ form.username }}
            </div>

            <div class="mb-4 text-start">
                <label for="id_password" class="form-label fw-semibold">Пароль</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5">Войти</button>
        </form>

        <hr class="my-4">
        <div class="text-center">
            <a href="/" class="text-decoration-none small text-secondary">&larr; Вернуться к входу учеников</a>
        </div>
    </div>
</div>
{% endblock %}
