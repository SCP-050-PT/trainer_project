{% extends "base.html" %}
{% block title %}Школьный портал{% endblock %}

{% block guest_content %}
<div class="text-center mb-4">
    <h1 class="fw-bold" style="color:#1e293b;">Школьный портал</h1>
    <p class="text-muted">Мультипредметный тренажёр</p>
</div>

<div class="row g-3 justify-content-center">
    <div class="col-md-5">
        <a href="{% url 'student_login' %}" class="card text-decoration-none h-100 border-0 shadow-sm">
            <div class="card-body text-center p-4">
                <svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:#10b981;margin-bottom:12px"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
                <h5 class="fw-bold text-dark">Ученик</h5>
                <p class="text-muted small mb-0">Вход по классу и PIN</p>
            </div>
        </a>
    </div>
    <div class="col-md-5">
        <a href="{% url 'login' %}" class="card text-decoration-none h-100 border-0 shadow-sm">
            <div class="card-body text-center p-4">
                <svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:#7c3aed;margin-bottom:12px"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"></path></svg>
                <h5 class="fw-bold text-dark">Учитель</h5>
                <p class="text-muted small mb-0">Вход для сотрудников</p>
            </div>
        </a>
    </div>
</div>
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();})</script>
{% endblock %}
